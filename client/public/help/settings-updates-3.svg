<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" role="img" aria-labelledby="title desc"><title id="title">Save and restart</title><desc id="desc">CanAI saves board edits, restarts, and reloads once after updating</desc><rect width="640" height="360" rx="24" fill="#f6f7f8"/><rect x="54" y="56" width="532" height="244" rx="16" fill="#fff" stroke="#d8d0c8"/><rect x="94" y="108" width="116" height="82" rx="10" fill="#edeff2"/><text x="152" y="142" text-anchor="middle" font-family="Arial,sans-serif" font-size="16" font-weight="700" fill="#17181a">Save</text><text x="152" y="166" text-anchor="middle" font-family="Arial,sans-serif" font-size="13" fill="#6b625b">board edits</text><line x1="236" y1="149" x2="300" y2="149" stroke="#d33f21" stroke-width="5" stroke-linecap="round"/><path d="M292 139 L304 149 L292 159" fill="none" stroke="#d33f21" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/><rect x="326" y="108" width="116" height="82" rx="10" fill="#fff4ee" stroke="#d33f21"/><text x="384" y="142" text-anchor="middle" font-family="Arial,sans-serif" font-size="16" font-weight="700" fill="#d33f21">Restart</text><text x="384" y="166" text-anchor="middle" font-family="Arial,sans-serif" font-size="13" fill="#6b625b">server returns</text><line x1="468" y1="149" x2="532" y2="149" stroke="#d33f21" stroke-width="5" stroke-linecap="round"/><path d="M524 139 L536 149 L524 159" fill="none" stroke="#d33f21" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/><text x="530" y="218" text-anchor="middle" font-family="Arial,sans-serif" font-size="16" font-weight="700" fill="#17181a">Reload once</text><text x="320" y="272" text-anchor="middle" font-family="Arial,sans-serif" font-size="14" fill="#6b625b">An offline or unresolved board blocks the restart.</text></svg>
