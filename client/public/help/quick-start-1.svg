<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" role="img" aria-labelledby="title desc">
  <title id="title">Create a local board from the gallery toolbar</title>
  <desc id="desc">New board, Import, Trash, search, storage filters, and Sort share one desktop toolbar row. Choose New board, then Local.</desc>
  <rect width="640" height="360" rx="24" fill="#0e0f12"/>
  <g font-family="Arial,sans-serif">
    <text x="32" y="52" font-size="28" font-weight="700" fill="#f4f5f6">Your boards</text>
    <g stroke="#34373d" fill="#1d1f24">
      <rect x="124" y="80" width="56" height="36" rx="8"/>
      <rect x="188" y="80" width="52" height="36" rx="8"/>
      <rect x="248" y="80" width="110" height="36" rx="8"/>
      <rect x="366" y="80" width="158" height="36" rx="8"/>
      <rect x="532" y="80" width="76" height="36" rx="8"/>
    </g>
    <rect x="32" y="80" width="84" height="36" rx="8" fill="#d33f21"/>
    <g font-size="11" text-anchor="middle" fill="#f4f5f6">
      <text x="74" y="102" font-weight="700">+ New board</text>
      <text x="152" y="102">Import</text>
      <text x="214" y="102">Trash</text>
      <text x="303" y="102" fill="#b1b5bd">Search boards…</text>
      <text x="570" y="102" font-size="10">Sort Recent</text>
    </g>
    <rect x="370" y="84" width="28" height="28" rx="6" fill="#34373d"/>
    <g font-size="9" text-anchor="middle" fill="#b1b5bd">
      <text x="384" y="101" fill="#f4f5f6">All</text>
      <text x="446" y="101">On this computer</text>
      <text x="506" y="101">Team</text>
    </g>
    <path d="M74 124 V154 H156" fill="none" stroke="#f08d73" stroke-width="3" stroke-linecap="round"/>
    <path d="M148 148 L156 154 L148 160" fill="none" stroke="#f08d73" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="172" y="136" width="240" height="108" rx="12" fill="#1d1f24" stroke="#34373d"/>
    <text x="192" y="166" font-size="20" font-weight="700" fill="#f4f5f6">New board</text>
    <rect x="192" y="184" width="88" height="40" rx="8" fill="#d33f21"/>
    <text x="236" y="210" text-anchor="middle" font-size="16" font-weight="700" fill="#ffffff">Local</text>
    <text x="300" y="210" font-size="16" fill="#b1b5bd">Team</text>
    <text x="32" y="292" font-size="20" font-weight="700" fill="#f4f5f6">New board → Local</text>
    <text x="32" y="322" font-size="16" fill="#b1b5bd">Your board stays on this computer.</text>
  </g>
</svg>
