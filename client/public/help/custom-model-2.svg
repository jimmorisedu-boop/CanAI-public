<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" role="img" aria-labelledby="title desc"><title id="title">Review and test a model</title><desc id="desc">Review references and the estimated price, including Krea megapixels and reasoning, then confirm the paid test.</desc><rect width="640" height="360" rx="24" fill="#f6f7f8"/><rect x="20" y="20" width="600" height="42" rx="10" fill="#edeff2"/><circle cx="42" cy="41" r="6" fill="#d33f21"/><text x="58" y="47" text-anchor="start" font-family="Arial,sans-serif" font-size="18" font-weight="700" fill="#17181a">CanAI</text><text x="536" y="46" text-anchor="start" font-family="Arial,sans-serif" font-size="13" font-weight="700" fill="#626970">Boards</text><rect x="44" y="92" width="552" height="204" rx="10" fill="#ffffff" stroke="#d7dce1"/><text x="66" y="122" text-anchor="start" font-family="Arial,sans-serif" font-size="19" font-weight="700" fill="#17181a">2  Test</text><rect x="66" y="140" width="152" height="70" rx="8" fill="#d9eef4" stroke="#79aebd"/><text x="142" y="180" text-anchor="middle" font-family="Arial,sans-serif" font-size="14" font-weight="700" fill="#17181a">sample refs</text><rect x="242" y="140" width="160" height="70" rx="8" fill="#fff4ee" stroke="#d33f21"/><text x="322" y="176" text-anchor="middle" font-family="Arial,sans-serif" font-size="14" font-weight="700" fill="#d33f21">estimated price</text><rect x="434" y="158" width="116" height="30" rx="7" fill="#d33f21" stroke="#d33f21"/><text x="492" y="178" text-anchor="middle" font-family="Arial,sans-serif" font-size="13" font-weight="700" fill="#ffffff">Test model</text><text x="434" y="199" text-anchor="middle" font-family="Arial,sans-serif" font-size="12" font-weight="400" fill="#626970">confirm before paid run</text><text x="66" y="248" font-family="Arial,sans-serif" font-size="13" fill="#626970">Krea: output + references in MP; high reasoning adds 5 MP</text><text x="66" y="273" font-family="Arial,sans-serif" font-size="13" fill="#626970">Maximum-size estimate; actual usage can be lower</text><g id="english-media-controls"><rect x="148" y="310" width="344" height="32" rx="8" fill="#edeff2"/><path d="M160 320 L168 326 L160 332 Z" fill="#d33f21"/><text x="185" y="331" font-family="Arial,sans-serif" font-size="13" fill="#17181a">Play</text><line x1="226" y1="326" x2="286" y2="326" stroke="#9ca3af" stroke-width="3"/><circle cx="250" cy="326" r="4" fill="#d33f21"/><text x="300" y="331" font-family="Arial,sans-serif" font-size="13" fill="#17181a">Seek</text><text x="356" y="331" font-family="Arial,sans-serif" font-size="13" fill="#17181a">Mute</text><text x="414" y="331" font-family="Arial,sans-serif" font-size="13" fill="#17181a">Volume</text></g></svg>