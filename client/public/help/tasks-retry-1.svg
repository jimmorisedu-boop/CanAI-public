<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" role="img" aria-labelledby="title desc"><title id="title">Read the error before retrying</title><desc id="desc">Review the English error in Tasks. The diagnostic log keeps the original server response. English system notices preserve the original response in Diagnostics.</desc><rect width="640" height="360" rx="24" fill="#f6f7f8"/><rect x="20" y="20" width="600" height="48" rx="12" fill="#edeff2"/><circle cx="46" cy="44" r="7" fill="#d33f21"/><text x="64" y="50" text-anchor="start" font-family="Arial, sans-serif" font-size="20" font-weight="700" fill="#17181a">CanAI</text><rect x="42" y="104" width="554" height="140" rx="12" fill="#ffffff" stroke="#d8d0c8"/><text x="64" y="136" text-anchor="start" font-family="Arial, sans-serif" font-size="20" font-weight="700" fill="#17181a">Read the error</text><rect x="64" y="158" width="220" height="48" rx="8" fill="#edeff2" stroke="#d8d0c8"/><text x="174" y="188" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="700" fill="#17181a">File type not supported</text><line x1="316" y1="182" x2="394" y2="182" stroke="#d33f21" stroke-width="5" stroke-linecap="round"/><path d="M394 172 L404 182 L394 192" fill="none" stroke="#d33f21" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/><rect x="424" y="158" width="162" height="48" rx="8" fill="#fff4ee" stroke="#d33f21"/><text x="505" y="189" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="700" fill="#d33f21">Tasks</text><text x="320" y="288" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="#5f6368">Original server response → diagnostic log</text></svg>
