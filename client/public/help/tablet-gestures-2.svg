<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" role="img" aria-labelledby="title desc"><title id="title">Pan, zoom, and move the prompt</title><desc id="desc">Pan, zoom, and move the prompt</desc><rect width="640" height="360" rx="24" fill="#f6f7f8"/><rect x="20" y="20" width="600" height="48" rx="12" fill="#edeff2"/><circle cx="46" cy="44" r="7" fill="#d33f21"/><text x="64" y="50" text-anchor="start" font-family="Arial,sans-serif" font-size="19" font-weight="700" fill="#17181a">CanAI tablet</text><rect x="38" y="96" width="564" height="218" rx="10" fill="#ffffff" stroke="#d8d0c8"/><text x="62" y="128" text-anchor="start" font-family="Arial,sans-serif" font-size="20" font-weight="700" fill="#17181a">Canvas</text><rect x="62" y="150" width="216" height="118" rx="10" fill="#ffffff" stroke="#d8d0c8"/><text x="170" y="184" text-anchor="middle" font-family="Arial,sans-serif" font-size="16" font-weight="700" fill="#17181a">one finger</text><circle cx="170" cy="214" r="12" fill="#d33f21" stroke="none"/><line x1="170" y1="244" x2="212" y2="244" stroke="#d33f21" stroke-width="4" stroke-linecap="round"/><path d="M212 236 L222 244 L212 252" fill="none" stroke="#d33f21" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><text x="222" y="268" text-anchor="middle" font-family="Arial,sans-serif" font-size="14" font-weight="700" fill="#d33f21">pan</text><rect x="326" y="150" width="240" height="118" rx="10" fill="#fff4ee" stroke="#d33f21"/><text x="350" y="180" text-anchor="start" font-family="Arial,sans-serif" font-size="18" font-weight="700" fill="#17181a">Prompt</text><line x1="412" y1="218" x2="480" y2="218" stroke="#d33f21" stroke-width="5" stroke-linecap="round"/><circle cx="402" cy="218" r="11" fill="#d33f21" stroke="none"/><circle cx="492" cy="218" r="11" fill="#d33f21" stroke="none"/><line x1="402" y1="202" x2="376" y2="186" stroke="#d33f21" stroke-width="4" stroke-linecap="round"/><path d="M376 178 L386 186 L376 194" fill="none" stroke="#d33f2