<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" role="img" aria-labelledby="title desc"><title id="title">Navigate the local Canvas</title><desc id="desc">Use the Board map, Space and drag, or the mouse wheel to move around the local Canvas.</desc><rect width="640" height="360" rx="24" fill="#f6f7f8"/><rect x="20" y="20" width="600" height="48" rx="12" fill="#edeff2"/><circle cx="46" cy="44" r="7" fill="#d33f21"/><text x="64" y="50" text-anchor="start" font-family="Arial,sans-serif" font-size="20" font-weight="700" fill="#17181a">CanAI</text><rect x="32" y="84" width="576" height="244" rx="14" fill="#fff" stroke="#d8d0c8"/><text x="54" y="113" text-anchor="start" font-family="Arial,sans-serif" font-size="19" font-weight="700" fill="#17181a">Canvas</text><rect x="54" y="128" width="174" height="126" rx="10" fill="#fff4ee" stroke="#d33f21"/><text x="72" y="154" text-anchor="start" font-family="Arial,sans-serif" font-size="17" font-weight="700" fill="#d33f21">Board map</text><rect x="72" y="168" width="92" height="64" rx="5" fill="#fff" stroke="#d8d0c8"/><rect x="178" y="168" width="31" height="25" rx="4" fill="#d9eef4"/><rect x="178" y="199" width="31" height="33" rx="4" fill="#edeff2"/><rect x="88" y="181" width="39" height="28" fill="#d33f21" opacity=".78"/><rect x="84" y="177" width="47" height="36" fill="none" stroke="#d33f21" stroke-width="2"/><text x="141" y="247" text-anchor="middle" font-family="Arial,sans-serif" font-size="12" fill="#6b625b">click or drag</text><rect x="252" y="128" width="334" height="126" rx="10" fill="#fff" stroke="#d8d0c8"/><text x="274" y="154" text-anchor="start" font-family="Arial,sans-serif" font-size="18" font-weight="700" fill="#17181a">Pan / zoom</text><rect x="274" y="170" width="118" height="34" rx="7" fill="#edeff2" stroke="#d8d0c8"/><text x="333" y="192" text-anchor="middle" font-family="Arial,sans-serif" font-size="14" font-weight="700" fill="#17181a">Space + drag</text><rect x="404" y="170" width="78" height="34" rx="7" fill="#edeff2" stroke="#d8d0c8"/><text x="443" y="192" text-anchor="middle" font-family="Arial,sans-serif" font-size="14" font-weight="700" fill="#17181a">scroll</text><line x1="500" y1="187" x2="548" y2="187" stroke="#d33f21" stroke-width="4" stroke-linecap="round"/><path d="M548 179L558 187L548 195" fill="none" stroke="#d33f21" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><rect x="274" y="216" width="136" height="28" rx="7" fill="#fff4ee" stroke="#d33f21"/><text x="342" y="235" text-anchor="middle" font-family="Arial,sans-serif" font-size="13" font-weight="700" fill="#d33f21">Shift + 1 · fit</text><rect x="44" y="286" width="300" height="30" rx="8" fill="#edeff2" stroke="#d8d0c8"/><text x="194" y="306" text-anchor="middle" font-family="Arial,sans-serif" font-size="14" font-weight="700" fill="#17181a">prompt dock</text></svg>
