<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" role="img" aria-labelledby="title desc"><title id="title">Return to CanAI with an edit result</title><desc id="desc">The first save creates a result beside the source; later saves update it</desc><rect width="640" height="360" rx="24" fill="#f6f7f8"/><rect x="20" y="20" width="600" height="48" rx="12" fill="#edeff2"/><circle cx="46" cy="44" r="7" fill="#d33f21"/><text x="64" y="50" text-anchor="start" font-family="Arial, sans-serif" font-size="20" font-weight="700" fill="#17181a">CanAI</text><rect x="48" y="106" width="188" height="128" rx="12" fill="#ffffff" stroke="#d8d0c8"/><text x="70" y="145" text-anchor="start" font-family="Arial, sans-serif" font-size="20" font-weight="700" fill="#17181a">Edit</text><text x="70" y="178" text-anchor="start" font-family="Arial, sans-serif" font-size="14" font-weight="400" fill="#6b625b">Return to CanAI</text><line x1="252" y1="170" x2="376" y2="170" stroke="#d33f21" stroke-width="5" stroke-linecap="round"/><path d="M376 160 L386 170 L376 180" fill="none" stroke="#d33f21" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/><rect x="414" y="106" width="178" height="128" rx="12" fill="#fff4ee" stroke="#d33f21"/><text x="438" y="145" text-anchor="start" font-family="Arial, sans-serif" font-size="20" font-weight="700" fill="#17181a">Preview</text><text x="438" y="178" text-anchor="start" font-family="Arial, sans-serif" font-size="14" font-weight="400" fill="#6b625b">first save → new result</text><rect x="48" y="274" width="164" height="32" rx="8" fill="#d33f21" stroke="#d33f21"/><text x="130" y="296" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="700" fill="#ffffff">Return to CanAI</text></svg>