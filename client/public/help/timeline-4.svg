<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" role="img" aria-labelledby="title desc">
  <title id="title">Saved frames below the video</title>
  <desc id="desc">The entire portrait video fits above a separate saved-frame strip. A selected thumbnail shows its time and a three-dot menu with To canvas, Download, and Delete actions. Applying without video edits closes the viewer without creating a video copy.</desc>
  <rect width="640" height="360" rx="12" fill="#202326"/>
  <g font-family="Arial,sans-serif">
    <rect x="12" y="12" width="616" height="196" rx="8" fill="#101214"/>
    <rect x="226" y="16" width="106" height="188" fill="#244653"/>
    <path d="m226 152 42-58 26 27 20-13 18 44v52H226Z" fill="#3c6673"/>
    <rect x="240" y="172" width="78" height="22" rx="4" fill="#101214"/>
    <text x="279" y="187" text-anchor="middle" font-size="11" fill="#f1f1ed">Full frame</text>
    <text x="24" y="34" font-size="11" fill="#a5a8a4">Video preview</text>
    <path d="M12 213h616" stroke="#4b4e51"/>
    <path d="m22 225 4 4 4-4" fill="none" stroke="#a5a8a4" stroke-width="1.5"/>
    <text x="44" y="233" font-size="11" fill="#f1f1ed">6</text>
    <text x="62" y="233" font-size="11" fill="#a5a8a4">Saved frames</text>
    <g fill="#244653" stroke="#4b4e51">
      <rect x="20" y="244" width="88" height="54" rx="6"/>
      <rect x="116" y="244" width="88" height="54" rx="6"/>
      <rect x="212" y="244" width="88" height="54" rx="6" stroke="#ef6545" stroke-width="2"/>
      <rect x="308" y="244" width="88" height="54" rx="6"/>
      <rect x="404" y="244" width="88" height="54" rx="6"/>
      <rect x="500" y="244" width="88" height="54" rx="6"/>
    </g>
    <g font-size="10" fill="#f1f1ed">
      <text x="26" y="290">00:00.29</text><text x="122" y="290">00:01.71</text>
      <text x="218" y="290">00:03.00</text><text x="314" y="290">00:04.79</text>
      <text x="410" y="290">00:05.33</text><text x="506" y="290">00:07.46</text>
    </g>
    <g fill="#f1f1ed">
      <circle cx="96" cy="253" r="1.5"/><circle cx="96" cy="258" r="1.5"/><circle cx="96" cy="263" r="1.5"/>
      <circle cx="192" cy="253" r="1.5"/><circle cx="192" cy="258" r="1.5"/><circle cx="192" cy="263" r="1.5"/>
      <circle cx="288" cy="253" r="1.5"/><circle cx="288" cy="258" r="1.5"/><circle cx="288" cy="263" r="1.5"/>
    </g>
    <rect x="350" y="97" width="220" height="108" rx="8" fill="#292c30" stroke="#62666a"/>
    <text x="366" y="123" font-size="12" fill="#f1f1ed">To canvas (G)</text>
    <text x="366" y="155" font-size="12" fill="#f1f1ed">Download (D)</text>
    <text x="366" y="187" font-size="12" fill="#ff6b6d">Delete frame from canvas</text>
    <text x="24" y="327" font-size="11" fill="#f1f1ed">Click a thumbnail to select it. B — hide / show frames.</text>
    <text x="24" y="346" font-size="11" fill="#a5a8a4">Without video edits, Apply closes without a video copy.</text>
  </g>
</svg>
