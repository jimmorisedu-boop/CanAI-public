<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" role="img" aria-labelledby="title desc">
  <title id="title">Saved frames popover over the video preview</title>
  <desc id="desc">Frame (S) and Frames (B) sit on the left of the transport. Opening Saved frames floats a glass popover over the lower-left preview without shifting the transport or timeline.</desc>
  <rect width="640" height="360" rx="12" fill="#141416"/>
  <g font-family="Arial,sans-serif">
    <rect x="16" y="14" width="608" height="252" rx="8" fill="#0d0e10" stroke="#2c2d31"/>
    <rect x="236" y="24" width="168" height="232" rx="6" fill="#243c48"/>
    <path d="M236 196 L288 134 L328 166 L364 142 L404 198 V256 H236 Z" fill="#355868"/>
    <text x="580" y="38" text-anchor="end" font-size="11" fill="#9ea2aa">Video preview</text>

    <rect x="28" y="142" width="388" height="112" rx="8" fill="#1c1e22" stroke="#3c3f46"/>
    <text x="42" y="164" font-size="11" fill="#f1f1ed">Saved frames · 3</text>
    <text x="398" y="164" text-anchor="end" font-size="12" fill="#9ea2aa">×</text>

    <g fill="#243c48" stroke="#454952">
      <rect x="42" y="176" width="104" height="64" rx="6"/>
      <rect x="156" y="176" width="104" height="64" rx="6" stroke="#d33f21" stroke-width="2"/>
      <rect x="270" y="176" width="104" height="64" rx="6"/>
    </g>
    <g font-size="10" fill="#f1f1ed">
      <text x="50" y="232">00:00.84</text>
      <text x="164" y="232">00:03.00</text>
      <text x="278" y="232">00:07.46</text>
    </g>
    <g fill="#f1f1ed">
      <circle cx="248" cy="186" r="1.5"/><circle cx="248" cy="191" r="1.5"/><circle cx="248" cy="196" r="1.5"/>
    </g>

    <rect x="428" y="142" width="182" height="96" rx="8" fill="#23262b" stroke="#4a4e57"/>
    <text x="444" y="166" font-size="11" fill="#f1f1ed">To canvas (G)</text>
    <text x="444" y="194" font-size="11" fill="#f1f1ed">Download (D)</text>
    <text x="444" y="222" font-size="11" fill="#f07566">Delete frame from canvas</text>

    <rect x="16" y="276" width="72" height="26" rx="6" fill="#1f2024" stroke="#34363b"/>
    <text x="52" y="293" text-anchor="middle" font-size="10" fill="#f1f1ed">Frame · S</text>
    <rect x="94" y="276" width="84" height="26" rx="6" fill="#2b1d1a" stroke="#d33f21"/>
    <text x="136" y="293" text-anchor="middle" font-size="10" fill="#f1f1ed">Frames · 3 · B</text>

    <rect x="272" y="274" width="32" height="30" rx="6" fill="#27292e" stroke="#454850"/>
    <path d="M285 283 V295 L295 289 Z" fill="#f1f1ed"/>
    <text x="316" y="293" font-size="11" fill="#f1f1ed">00:03.00 / 00:09.60</text>

    <text x="16" y="330" font-size="11" fill="#f1f1ed">Press S to save a frame; press B to toggle Saved frames without moving the player.</text>
    <text x="16" y="348" font-size="11" fill="#9ea2aa">Without video edits, Apply closes without creating a video copy.</text>
  </g>
</svg>
