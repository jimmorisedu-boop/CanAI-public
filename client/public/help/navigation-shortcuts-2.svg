<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" role="img" aria-labelledby="title desc"><title id="title">Fit the local Canvas</title><desc id="desc">Press Shift plus 1 to fit the whole Board, then use the map or pan and zoom controls to move around it.</desc><rect width="640" height="360" rx="24" fill="#f6f7f8"/><rect x="20" y="20" width="600" height="48" rx="12" fill="#edeff2"/><circle cx="46" cy="44" r="7" fill="#d33f21"/><text x="64" y="50" text-anchor="start" font-family="Arial,sans-serif" font-size="20" font-weight="700" fill="#17181a">CanAI</text><rect x="32" y="84" width="576" height="244" rx="14" fill="#fff" stroke="#d8d0c8"/><text x="54" y="113" text-anchor="start" font-family="Arial,sans-serif" font-size="19" font-weight="700" fill="#17181a">View controls</text><rect x="54" y="132" width="186" height="128" rx="10" fill="#fff4ee" stroke="#d33f21"/><text x="76" y="160" text-anchor="start" font-family="Arial,sans-serif" font-size="17" font-weight="700" fill="#d33f21">Fit the Board</text><rect x="76" y="177" width="142" height="42" rx="8" fill="#d33f21"/><text x="147" y="204" text-anchor="middle" font-family="Arial,sans-serif" font-size="16" font-weight="700" fill="#fff">Shift + 1</text><text x="76" y="244" text-anchor="start" font-family="Arial,sans-serif" font-size="12" fill="#6b625b">show the whole canvas</text><line x1="256" y1="196" x2="302" y2="196" stroke="#d33f21" stroke-width="4" stroke-linecap="round"/><path d="M302 188L312 196L302 204" fill="none" stroke="#d33f21" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><rect x="326" y="132" width="250" height="128" rx="10" fill="#fff" stroke="#d8d0c8"/><text x="348" y="160" text-anchor="start" font-family="Arial,sans-serif" font-size="17" font-weight="700" fill="#17181a">Move the view</text><rect x="348" y="178" width="96" height="32" rx="7" fill="#edeff2" stroke="#d8d0c8"/><text x="396" y="199" text-anchor="middle" font-family="Arial,sans-serif" font-size="13" font-weight="700" fill="#17181a">map</text><rect x="454" y="178" width="100" height="32" rx="7" fill="#edeff2" stroke="#d8d0c8"/><text x="504" y="199" text-anchor="middle" font-family="Arial,sans-serif" font-size="13" font-weight="700" fill="#17181a">Space + drag</text><rect x="348" y="220" width="96" height="28" rx="7" fill="#edeff2" stroke="#d8d0c8"/><text x="396" y="239" text-anchor="middle" font-family="Arial,sans-serif" font-size="13" font-weight="700" fill="#17181a">scroll</text><text x="454" y="239" text-anchor="start" font-family="Arial,sans-serif" font-size="12" fill="#6b625b">zoom</text><rect x="44" y="286" width="300" height="30" rx="8" fill="#edeff2" stroke="#d8d0c8"/><text x="194" y="306" text-anchor="middle" font-family="Arial,sans-serif" font-size="14" font-weight="700" fill="#17181a">prompt dock</text></svg>
