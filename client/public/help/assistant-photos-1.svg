<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" role="img" aria-labelledby="title desc"><title id="title">Import a photo onto the Canvas</title><desc id="desc">Drop a photo file onto the Canvas to create a local card</desc><rect width="640" height="360" rx="24" fill="#f6f7f8"/><rect x="20" y="20" width="600" height="42" rx="10" fill="#edeff2"/><circle cx="42" cy="41" r="6" fill="#d33f21"/><text x="58" y="47" font-family="Arial,sans-serif" font-size="18" font-weight="700" fill="#17181a">CanAI</text><rect x="38" y="84" width="564" height="228" rx="9" fill="#fff" stroke="#d7dce1"/><text x="58" y="114" font-family="Arial,sans-serif" font-size="17" font-weight="700" fill="#17181a">Canvas</text><rect x="64" y="142" width="130" height="88" rx="9" fill="#fff" stroke="#d7dce1"/><rect x="80" y="158" width="44" height="44" rx="7" fill="#d9eef4" stroke="#79aebd"/><path d="M91 190l11-14 10 10 8-8 10 14" fill="none" stroke="#79aebd" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><text x="145" y="219" text-anchor="middle" font-family="Arial,sans-serif" font-size="12" font-weight="700" fill="#17181a">photo.jpg</text><line x1="207" y1="185" x2="328" y2="185" stroke="#d33f21" stroke-width="4" stroke-linecap="round"/><path d="M328 175l12 10-12 10" fill="none" stroke="#d33f21" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><rect x="366" y="132" width="190" height="116" rx="10" fill="#edeff2" stroke="#d33f21" stroke-width="2" stroke-dasharray="8 6"/><text x="461" y="178" text-anchor="middle" font-family="Arial,sans-serif" font-size="16" font-weight="700" fill="#17181a">Drop photo</text><text x="461" y="203" text-anchor="middle" font-family="Arial,sans-serif" font-size="13" fill="#626970">or paste from clipboard</text><rect x="366" y="266" width="146" height="28" rx="7" fill="#d9eef4"/><text x="439" y="285" text-anchor="middle" font-family="Arial,sans-serif" font-size="12" font-weight="700" fill="#17181a">Canvas card appears</text></svg>
