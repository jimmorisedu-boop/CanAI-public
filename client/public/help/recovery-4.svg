<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" role="img" aria-labelledby="title desc">
<title id="title">Review recovered data before retrying</title><desc id="desc">Saved provider requests resume; uncertain requests stay on hold while media cleanup is paused.</desc>
<rect width="640" height="360" rx="24" fill="#f6f7f8"/>
<g font-family="Arial,sans-serif" fill="#17181a">
<rect x="20" y="20" width="600" height="44" rx="10" fill="#edeff2"/>
<circle cx="43" cy="42" r="6" fill="#d33f21"/><text x="60" y="48" font-size="18" font-weight="700">CanAI</text>
<rect x="42" y="86" width="556" height="82" rx="12" fill="#fff4ee" stroke="#d33f21"/>
<text x="62" y="118" font-size="20" font-weight="700">Recovered data needs review</text>
<text x="62" y="145" font-size="15" fill="#626970">Keep the app folder. Media cleanup is paused.</text>
<rect x="42" y="190" width="556" height="56" rx="10" fill="#ffffff" stroke="#d7dce1"/>
<text x="62" y="224" font-size="16">Saved provider request</text><text x="570" y="224" text-anchor="end" font-size="16" font-weight="700">Resume same request</text>
<rect x="42" y="264" width="556" height="56" rx="10" fill="#ffffff" stroke="#d7dce1"/>
<text x="62" y="298" font-size="16">Uncertain request</text><text x="570" y="298" text-anchor="end" font-size="16" font-weight="700" fill="#d33f21">Hold for review</text>
</g></svg>
