<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" role="img" aria-labelledby="title desc"><title id="title">Tablet video actions</title><desc id="desc">Large video preview, one timeline, and contextual editing tools.</desc><rect width="640" height="360" rx="12" fill="#101114"/><text x="16" y="23" font-family="Arial,sans-serif" font-size="12" fill="#e4e6eb">Cancel</text><text x="78" y="23" font-family="Arial,sans-serif" font-size="15" fill="#e4e6eb">Clip editing</text><rect x="544" y="7" width="80" height="25" rx="6" fill="#d33f21" stroke="#d33f21"/><text x="570" y="24" font-family="Arial,sans-serif" font-size="12" fill="#e4e6eb">Apply</text><rect x="20" y="45" width="400" height="225" rx="6" fill="#282e38" stroke="#363a44"/><path d="M210 137 L210 179 L245 158 Z" fill="#aeb8c8"/><text x="158" y="249" font-family="Arial,sans-serif" font-size="13" fill="#bbc2cd">Video preview</text><rect x="52" y="63" width="336" height="189" fill="none" stroke="#ef6545" stroke-width="2"/><circle cx="52" cy="63" r="4" fill="#fff"/><circle cx="388" cy="63" r="4" fill="#fff"/><circle cx="52" cy="252" r="4" fill="#fff"/><circle cx="388" cy="252" r="4" fill="#fff"/><text x="440" y="64" font-family="Arial,sans-serif" font-size="14" fill="#e4e6eb">Crop</text><text x="440" y="98" font-family="Arial,sans-serif" font-size="11" fill="#afb5c0">X</text><rect x="500" y="83" width="120" height="27" rx="6" fill="#22252c" stroke="#363a44"/><text x="511" y="101" font-family="Arial,sans-serif" font-size="12" fill="#e4e6eb">8%</text><text x="440" y="137" font-family="Arial,sans-serif" font-size="11" fill="#afb5c0">Y</text><rect x="500" y="122" width="120" height="27" rx="6" fill="#22252c" stroke="#363a44"/><text x="511" y="140" font-family="Arial,sans-serif" font-size="12" fill="#e4e6eb">8%</text><text x="440" y="176" font-family="Arial,sans-serif" font-size="11" fill="#afb5c0">Width</text><rect x="500" y="161" width="120" height="27" rx="6" fill="#22252c" stroke="#363a44"/><text x="511" y="1